<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Lindungi halaman demo: hanya dibuka jika sesi login tersedia.
        (function () {
            try {
                const user = JSON.parse(sessionStorage.getItem('kampuslyCurrentUser') || 'null');
                if (!user || !user.peran) window.location.replace('index.html');
            } catch (error) {
                window.location.replace('index.html');
            }
        })();
    </script>
    <title>Disposisi | Persuratan TSU</title>
    <link rel="stylesheet" href="style.css?v=13">
    <link rel="stylesheet" href="surat.css?v=12">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Terapkan tema tersimpan sebelum halaman digambar (mencegah kedip)
        try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
        catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
</head>
<body class="preload">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="mainSidebar">
        <div class="sidebar-top">
            <div class="logo">
                <img src="logo-tsu.png" alt="TSU Logo" class="logo-img">
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard" class="icon"></i>
                    <span>Dashboard</span>
                </a>
                <a href="penomoran.html" class="nav-item">
                    <i data-lucide="file-plus" class="icon"></i>
                    <span>Penomoran</span>
                </a>
                <a href="disposisi.html" class="nav-item active">
                    <i data-lucide="clipboard-check" class="icon"></i>
                    <span>Disposisi</span>
                </a>
                <a href="surat_masuk.html" class="nav-item">
                    <i data-lucide="inbox" class="icon"></i>
                    <span>Surat Masuk</span>
                </a>
                <a href="surat_keluar.html" class="nav-item">
                    <i data-lucide="send" class="icon"></i>
                    <span>Surat Keluar</span>
                </a>
                <a href="arsip.html" class="nav-item">
                    <i data-lucide="archive" class="icon"></i>
                    <span>Pengarsipan</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-bottom">
            <a href="#" class="nav-item">
                <i data-lucide="settings" class="icon"></i>
                <span>Settings</span>
            </a>
            <a href="index.html" class="nav-item" id="logoutBtn" title="Keluar dari akun">
                <i data-lucide="log-out" class="icon"></i>
                <span>Log out</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div>
                <p class="page-sub">Persuratan</p>
                <h2>Disposisi</h2>
            </div>
            <div class="header-right">
                <button class="btn-icon" type="button" id="themeToggle" aria-label="Ganti tema gelap/terang" title="Ganti tema">
                    <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
                <span id="currentUserLabel" class="user-label">Admin TSU</span>
                <img src="https://i.pravatar.cc/150?img=32" alt="Profil Admin TSU" class="profile-img">
            </div>
        </header>

        <div class="stat-strip">
            <div class="kpi-card dark">
                <p class="kpi-title" id="sJudul1">Perlu disposisi</p>
                <h3 class="kpi-value" id="sPerlu">0</h3>
                <p class="kpi-trend">Surat masuk menunggu pimpinan</p>
            </div>
            <div class="kpi-card">
                <p class="kpi-title">Proses staf</p>
                <h3 class="kpi-value" id="sProses" style="color:var(--red)">0</h3>
                <p class="kpi-trend negative">Sedang dikerjakan</p>
            </div>
            <div class="kpi-card">
                <p class="kpi-title">Selesai</p>
                <h3 class="kpi-value" id="sSelesai" style="color:var(--green)">0</h3>
                <p class="kpi-trend positive">Tugas disposisi tuntas</p>
            </div>
        </div>

        <section class="panel">
            <div class="panel-head">
                <div class="seg" id="segStatus" role="radiogroup" aria-label="Filter disposisi"></div>
                <div class="toolbar">
                    <input type="text" id="q" placeholder="Cari agenda, perihal, staf…" aria-label="Cari disposisi">
                </div>
            </div>
            <div class="alur-info" id="alurInfo"></div>
            <div class="galeri" id="galeri"><p class="galeri-kosong">Memuat…</p></div>
        </section>
    </main>

    <!-- Buat disposisi (pimpinan) -->
    <dialog class="modal" id="dlgDisp">
        <form id="dispForm" novalidate>
            <div class="modal-head">
                <h3>Buat disposisi</h3>
                <p id="dInfo"></p>
            </div>
            <div class="modal-body">
                <div class="field"><label for="d_staf">Teruskan kepada staf <span class="req">*</span></label><select id="d_staf"></select></div>
                <div class="field"><label for="d_instruksi">Instruksi <span class="req">*</span></label>
                    <textarea id="d_instruksi" maxlength="500" placeholder="Contoh: Tindak lanjuti dan siapkan balasan."></textarea></div>
                <div class="field"><label for="d_batas">Batas waktu <span class="opt">(opsional)</span></label><input type="date" id="d_batas"></div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn" id="dBatal">Batal</button>
                <button type="submit" class="btn primary" id="dSimpan">Kirim disposisi</button>
            </div>
        </form>
    </dialog>

    <!-- Selesaikan tugas (staf) -->
    <dialog class="modal" id="dlgSelesai">
        <form id="selesaiForm" novalidate>
            <div class="modal-head">
                <h3>Selesaikan tugas</h3>
                <p id="sInfo"></p>
            </div>
            <div class="modal-body">
                <div class="field"><label for="s_catatan">Catatan penyelesaian <span class="opt">(opsional)</span></label>
                    <textarea id="s_catatan" maxlength="500" placeholder="Contoh: Balasan sudah dikirim."></textarea></div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn" id="sBatal">Batal</button>
                <button type="submit" class="btn primary" id="sSimpan">Tandai selesai</button>
            </div>
        </form>
    </dialog>

    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Buka sidebar" aria-expanded="false" aria-controls="mainSidebar" title="Buka/tutup menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="toast" id="toast" role="status"></div>

    <script src="app.js?v=5"></script>
    <script src="profil.js?v=1"></script>
    <script src="disposisi.js?v=9"></script>
    <script src="mobile.js?v=1"></script>
</body>
</html>
