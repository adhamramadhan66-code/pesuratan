<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Lindungi halaman demo: hanya dibuka jika sesi login tersedia.
        (function () {
            try {
                const user = JSON.parse(sessionStorage.getItem('kampuslyCurrentUser') || 'null');
                if (!user || user.email !== 'admin@tsu.ac.id') window.location.replace('index.html');
            } catch (error) {
                window.location.replace('index.html');
            }
        })();
    </script>
    <title>Dashboard | Persuratan TSU</title>
    <link rel="stylesheet" href="style.css?v=13">
    <link rel="stylesheet" href="surat.css?v=14">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Terapkan tema tersimpan sebelum halaman digambar (mencegah kedip)
        try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
        catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
</head>
<body class="preload">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="mainSidebar">
        <div class="sidebar-top">
            <div class="logo">
                <img src="logo-tsu.png" alt="TSU Logo" class="logo-img">
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item active">
                    <i data-lucide="layout-dashboard" class="icon"></i>
                    <span>Dashboard</span>
                </a>
                <a href="penomoran.html" class="nav-item">
                    <i data-lucide="file-plus" class="icon"></i>
                    <span>Penomoran</span>
                </a>
                <a href="disposisi.html" class="nav-item">
                    <i data-lucide="clipboard-check" class="icon"></i>
                    <span>Disposisi</span>
                </a>
                <a href="surat_masuk.html" class="nav-item">
                    <i data-lucide="inbox" class="icon"></i>
                    <span>Surat Masuk</span>
                </a>
                <a href="surat_keluar.html" class="nav-item">
                    <i data-lucide="send" class="icon"></i>
                    <span>Surat Keluar</span>
                </a>
                <a href="arsip.html" class="nav-item">
                    <i data-lucide="archive" class="icon"></i>
                    <span>Pengarsipan</span>
                </a>
            </nav>
        </div>

        <div class="sidebar-bottom">
            <a href="#" class="nav-item">
                <i data-lucide="settings" class="icon"></i>
                <span>Settings</span>
            </a>
            <a href="index.html" class="nav-item" id="logoutBtn" title="Keluar dari akun">
                <i data-lucide="log-out" class="icon"></i>
                <span>Log out</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <div>
                <p class="page-sub">Persuratan</p>
                <h2>Dashboard</h2>
            </div>
            <div class="header-right">
                <form class="search-box" id="searchForm">
                    <i data-lucide="search" class="icon-search"></i>
                    <input type="text" id="searchInput" placeholder="Cari nomor / perihal surat..." aria-label="Cari surat">
                </form>
                <button class="btn-icon" type="button" id="themeToggle" aria-label="Ganti tema gelap/terang" title="Ganti tema">
                    <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
                <span id="currentUserLabel" class="user-label">Admin TSU</span>
                <img src="https://i.pravatar.cc/150?img=32" alt="Profil Admin TSU" class="profile-img">
            </div>
        </header>

        <!-- FILTERS -->
        <div class="filters" data-dash>
            <div class="filter-group">
                <button type="button" data-period="day">Day</button>
                <button type="button" data-period="week">Week</button>
                <button type="button" data-period="month" class="active">Month</button>
                <button type="button" data-period="year">Year</button>
            </div>

            <div class="date-picker-wrapper">
                <button type="button" class="date-picker" id="datePickerBtn" aria-haspopup="dialog" aria-expanded="false">
                    <i data-lucide="calendar" class="icon-small"></i>
                    <span id="dateRangeText"></span>
                </button>
                <div class="datepicker-popup" id="datepickerPopup" role="dialog" aria-label="Pilih tanggal">
                    <div class="popup-header">
                        <select id="monthSelect" aria-label="Bulan"></select>
                        <select id="yearSelect" aria-label="Tahun"></select>
                    </div>
                    <div class="popup-grid-header">
                        <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                    </div>
                    <div class="popup-dates" id="popupDates"></div>
                    <div class="popup-footer">
                        <button type="button" class="popup-today" id="popupToday">Today</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- JENIS SURAT: geser otomatis / diseret; "Lihat semua" mengubah dashboard jadi kotak-kotak -->
        <section class="jenis-sec" id="jenisSec" aria-label="Jenis surat">
            <div class="jenis-head">
                <h3>Jenis surat</h3>
                <button type="button" class="btn sm" id="btnJenisSemua">Lihat semua</button>
            </div>
            <div class="jenis-track" id="jenisTrack" aria-label="Jenis surat yang sudah dibuat"></div>
            <div class="jenis-grid" id="jenisGrid" hidden></div>
        </section>

        <!-- CHARTS AREA -->
        <div class="charts-grid" data-dash>
            <div class="chart-card main-chart">
                <div class="chart-header">
                    <h3 id="chartJudul">Surat per bulan</h3>
                    <select id="fGrafikJenis" class="grafik-filter" aria-label="Saring grafik menurut jenis surat"><option value="">Semua jenis surat</option></select>
                    <a class="btn-round" href="penomoran.html" title="Penomoran surat" aria-label="Penomoran surat"><i data-lucide="plus"></i></a>
                </div>
                <div class="bars" id="bars" aria-label="Grafik jumlah surat per bulan"></div>
            </div>
            <div class="chart-card side-chart">
                <div class="calendar-header">
                    <h3 id="calTitle"></h3>
                    <div class="calendar-nav">
                        <button type="button" class="cal-nav-btn" id="calPrev" aria-label="Bulan sebelumnya"><i data-lucide="chevron-left"></i></button>
                        <button type="button" class="cal-nav-btn" id="calNext" aria-label="Bulan berikutnya"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
                <div class="mini-calendar">
                    <div class="mini-days"><div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div></div>
                    <div class="mini-dates" id="miniDates"></div>
                </div>
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-card" data-dash>
            <div class="table-header">
                <h3>Surat terbaru pada rentang ini</h3>
                <div class="table-actions">
                    <a class="btn sm" href="arsip.html">Lihat semua</a>
                </div>
            </div>
            <div class="galeri" id="galeri"><p class="galeri-kosong">Memuat…</p></div>
        </div>
    </main>

    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Buka sidebar" aria-expanded="false" aria-controls="mainSidebar" title="Buka/tutup menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="toast" id="toast" role="status"></div>

    <script src="app.js?v=3"></script>
    <script src="profil.js?v=1"></script>
    <script>
        // Statistik dashboard: dimuat ulang setiap rentang tanggal berubah (event dari script.js).
        (function () {
            const { $, esc, tglIndo, api, toast } = App;
            const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            let terakhir = '', rentangIni = null;

            // ---------- Grafik: kolom dibuat sekali, lalu tingginya dianimasikan naik/turun ----------
            function gambarGrafik(data, maks, aktif) {
                const bars = $('bars');
                if (bars.children.length !== 12) {
                    bars.innerHTML = BLN.map((m) => '<div class="bar-col"><span class="v">0</span><div class="b" style="height:0"></div><span class="m">' + m + '</span></div>').join('');
                    void bars.offsetHeight;   // pastikan tinggi awal 0 tergambar dulu supaya batang "tumbuh" dari bawah
                }
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    [...bars.children].forEach((kol, i) => {
                        kol.classList.toggle('on', aktif(i));
                        kol.querySelector('.v').textContent = data[i];
                        kol.querySelector('.b').style.height = Math.round((data[i] / maks) * 85) + '%';
                    });
                }));
            }
            let filterTerisi = false;
            function isiFilterJenis(daftar) {
                if (filterTerisi || !daftar.length) return;
                filterTerisi = true;
                const sel = $('fGrafikJenis');
                sel.insertAdjacentHTML('beforeend', daftar.slice().sort((x, y) => x.nama.localeCompare(y.nama)).map((j) => '<option value="' + esc(j.kode) + '">' + esc(j.nama) + ' (' + esc(j.kode) + ')</option>').join(''));
            }
            $('fGrafikJenis').addEventListener('change', () => { if (rentangIni) document.dispatchEvent(new CustomEvent('rentang', { detail: rentangIni })); });

            // ---------- Jenis surat: carousel otomatis + seret, atau kotak-kotak (Lihat semua) ----------
            const trek = $('jenisTrack'), grid = $('jenisGrid'), tombol = $('btnJenisSemua');
            let posisi = 0, semuaMode = false, ttd = '', geserAktif = true, tahan = false;
            const kartuJenis = (j) => '<a class="jenis-card" draggable="false" href="arsip.html?q=' + encodeURIComponent('/' + j.kode + '/') + '">' +
                '<span class="jk">' + esc(j.kode) + '</span><span class="jn">' + esc(j.nama) + '</span><span class="jc"><b>' + j.n + '</b> surat</span></a>';
            function tampilJenis(daftar) {
                const tanda = JSON.stringify(daftar);
                if (tanda === ttd) return;
                ttd = tanda;
                grid.innerHTML = daftar.length ? daftar.map(kartuJenis).join('') : '<p class="galeri-kosong">Belum ada jenis surat.</p>';   // semua jenis, termasuk yang 0 surat
                const atas = daftar.slice(0, 8);   // jenis yang sudah dipakai di depan, sisanya mengisi sampai 8 kotak
                trek.innerHTML = atas.length ? '<div class="jenis-set">' + atas.map(kartuJenis).join('') + '</div>' : '<p class="galeri-kosong">Belum ada jenis surat.</p>';
                trek.scrollLeft = 0; posisi = 0;
                const set = trek.querySelector('.jenis-set');
                if (set) {
                    const asli = set.innerHTML;
                    for (let i = 0; i < 6 && set.scrollWidth <= trek.clientWidth + 16; i++) set.insertAdjacentHTML('beforeend', asli);   // pastikan lebih lebar dari layar
                    trek.appendChild(set.cloneNode(true));   // salinan agar putarannya mulus
                }
            }
            // geser otomatis (berhenti saat kursor di atasnya atau sedang diseret)
            function gerak() {
                const sets = trek.querySelectorAll('.jenis-set');
                if (geserAktif && !tahan && !semuaMode && sets.length === 2) {
                    posisi += 0.6;
                    const setengah = sets[1].offsetLeft - sets[0].offsetLeft;
                    if (posisi >= setengah) posisi -= setengah;
                    trek.scrollLeft = posisi;
                } else posisi = trek.scrollLeft;
                requestAnimationFrame(gerak);
            }
            requestAnimationFrame(gerak);
            trek.addEventListener('mouseenter', () => { tahan = true; });
            trek.addEventListener('mouseleave', () => { tahan = false; });
            trek.addEventListener('touchstart', () => { tahan = true; }, { passive: true });
            trek.addEventListener('touchend', () => { setTimeout(() => { tahan = false; }, 1500); });
            // seret dengan kursor
            let seret = null, bergerak = false;
            trek.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') return; seret = { x: e.clientX, kiri: trek.scrollLeft }; bergerak = false; trek.classList.add('menyeret'); });
            window.addEventListener('pointermove', (e) => {
                if (!seret) return;
                const dx = e.clientX - seret.x;
                if (Math.abs(dx) > 4) bergerak = true;
                let p = seret.kiri - dx;
                const sets = trek.querySelectorAll('.jenis-set');
                if (sets.length === 2) { const h = sets[1].offsetLeft - sets[0].offsetLeft; p = ((p % h) + h) % h; seret.kiri = p + dx; }
                trek.scrollLeft = p; posisi = p;
            });
            window.addEventListener('pointerup', () => { seret = null; trek.classList.remove('menyeret'); });
            trek.addEventListener('click', (e) => { if (bergerak) { e.preventDefault(); bergerak = false; } }, true);
            tombol.addEventListener('click', () => {
                semuaMode = !semuaMode;
                document.querySelectorAll('[data-dash]').forEach((el) => { el.hidden = semuaMode; });
                trek.hidden = semuaMode; grid.hidden = !semuaMode;
                tombol.textContent = semuaMode ? 'Kembali ke dashboard' : 'Lihat semua';
                $('jenisSec').classList.toggle('semua', semuaMode);
            });
            const pct = (n, t) => (t ? Math.round((n / t) * 100) : 0) + '%';

            document.addEventListener('rentang', async (ev) => {
                const { dari, sampai } = ev.detail;
                rentangIni = { dari, sampai };
                if (dari + sampai + $('fGrafikJenis').value === terakhir) return;
                terakhir = dari + sampai + $('fGrafikJenis').value;
                try {
                    const d = await api('api/surat.php?aksi=statistik&dari=' + dari + '&sampai=' + sampai + '&jenis=' + encodeURIComponent($('fGrafikJenis').value));
                    if (dari + sampai + $('fGrafikJenis').value !== terakhir) return;             // sudah ada permintaan yang lebih baru
                    const t = d.total;
                    tampilJenis(d.per_jenis || []);

                    // grafik batang per bulan (bulan yang masuk rentang disorot)
                    const y = +dari.slice(0, 4), awal = new Date(dari + 'T00:00'), akhir = new Date(sampai + 'T00:00');
                    const maks = Math.max(1, ...d.per_bulan);
                    $('chartJudul').textContent = 'Surat per bulan — ' + d.tahun;
                    gambarGrafik(d.per_bulan, maks, (i) => new Date(y, i + 1, 0) >= awal && new Date(y, i, 1) <= akhir);
                    isiFilterJenis(d.per_jenis || []);

                    $('galeri').innerHTML = d.terbaru.length ? d.terbaru.map((r) => App.kartuHtml({
                        kelas: r.status_arsip === 'diarsipkan' ? 'ok' : 'bad', judulTeks: r.nomor_surat, judul: esc(r.nomor_surat),
                        thumb: App.thumbFile('api/arsip.php?aksi=file&id=' + r.id, r.file_nama, r.ada_file),
                        sub: [esc(r.perihal), esc(tglIndo(r.tanggal_surat)) + ' · ' + (r.kode_tujuan === 'A' ? 'Internal' : 'Eksternal')],
                        status: '<span class="badge ' + (r.status_arsip === 'diarsipkan' ? 'ok' : 'warn') + '">' + (r.status_arsip === 'diarsipkan' ? 'Diarsipkan' : 'Belum diarsipkan') + '</span>',
                    })).join('') : '<p class="galeri-kosong">Tidak ada surat pada rentang tanggal ini.</p>';
                } catch (e) {
                    terakhir = '';
                    toast(e.message, true);
                    $('galeri').innerHTML = '<p class="galeri-kosong">' + esc(e.message) + '</p>';
                }
            });

            // Kotak cari di header -> halaman Pengarsipan
            $('searchForm').addEventListener('submit', (ev) => {
                ev.preventDefault();
                const q = $('searchInput').value.trim();
                window.location.href = 'arsip.html' + (q ? '?q=' + encodeURIComponent(q) : '');
            });
        })();
    </script>
    <script src="script.js?v=13"></script>
    <script src="mobile.js?v=1"></script>
</body>
</html>
