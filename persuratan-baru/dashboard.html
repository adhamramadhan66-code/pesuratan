<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Persuratan TSU</title>
    <link rel="stylesheet" href="style.css?v=15">
    <link rel="stylesheet" href="surat.css?v=25">
    <link rel="stylesheet" href="warna.css?v=1">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Terapkan tema tersimpan sebelum halaman digambar (mencegah kedip)
        try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
        catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
</head>
<body class="preload">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="mainSidebar">
        <div class="sidebar-top">
            <div class="logo">
                <img src="logo-tsu.png" alt="TSU Logo" class="logo-img">
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-item active">
                    <i data-lucide="layout-dashboard" class="icon"></i>
                    <span>Dashboard</span>
                </a>
                <a href="upload_surat.html" class="nav-item">
                    <i data-lucide="upload" class="icon"></i>
                    <span>Upload Surat</span>
                </a>
                <a href="data_surat.html" class="nav-item">
                    <i data-lucide="folder-open" class="icon"></i>
                    <span>Data Surat</span>
                </a>
            </nav>
        </div>    </aside>

    <main class="main-content ada-video" id="halUtama">
        <form class="cari-atas" id="cariAtas" role="search" autocomplete="off">
            <i data-lucide="search" class="icon-search"></i>
            <input type="search" id="cariUtama" placeholder="Cari surat: judul, nomor, perihal…" aria-label="Cari surat">
            <button type="button" class="cari-x" id="cariHapus" aria-label="Hapus pencarian" hidden>&times;</button>
        </form>
        <header class="header">
            <div>
                <p class="page-sub">Persuratan</p>
                <h2>Dashboard</h2>
            </div>
            <div class="header-right">
                <button class="btn-icon" type="button" id="themeToggle" aria-label="Ganti tema gelap/terang" title="Ganti tema">
                    <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                </button>
                <span id="currentUserLabel" class="user-label">Tamu</span>
                <img src="avatar-default.jpg" alt="Profil" class="profile-img">
            </div>
        </header>

        <!-- JENIS SURAT: geser otomatis / diseret; "Lihat semua" mengubah dashboard jadi kotak-kotak -->
        <!-- VIDEO (di atas dashboard). File: "vidssave.com MINI COMPRO TSU 1080P.mp4" di folder ini. -->
        <section class="hasil-cari" id="hasilCari" hidden aria-live="polite">
            <div class="table-header"><div><h3>Hasil pencarian</h3><span class="muted" id="hasilInfo" style="font-size:.8125rem"></span></div></div>
            <div class="dk-list" id="hasilList"></div>
            <div class="hasil-lagi"><button type="button" class="btn" id="hasilLagi" hidden>Tampilkan lebih banyak</button></div>
        </section>

        <section class="video-sec" id="videoSec" aria-label="Video profil TSU">
            <video id="heroVideo" autoplay loop muted playsinline disablepictureinpicture preload="auto" tabindex="-1">
                <source src="vidssave.com%20MINI%20COMPRO%20TSU%201080P.mp4" type="video/mp4">
            </video>
            <div class="video-kosong">Video belum tersedia. Taruh file <b>&nbsp;vidssave.com MINI COMPRO TSU 1080P.mp4&nbsp;</b> di folder ini.</div>
        </section>

        <section class="jenis-sec" id="jenisSec" aria-label="Jenis surat">
            <div class="jenis-head">
                <h3>Jenis surat <span class="jenis-rentang" id="jenisRentang"></span></h3>
                <button type="button" class="btn sm" id="btnJenisSemua">Lihat semua</button>
            </div>
            <div class="jenis-track" id="jenisTrack" aria-label="Jenis surat yang sudah dibuat"></div>
            <div class="jenis-grid" id="jenisGrid" hidden></div>
        </section>

        <!-- TABLE -->
        <div class="table-card" data-dash id="tabelTerbaru">
            <div class="table-header">
                <div><h3>Surat terbaru</h3><span class="muted" id="terbaruInfo" style="font-size:.8125rem"></span></div>
            </div>
            <div class="dk-list" id="galeri"><p class="galeri-kosong">Memuat…</p></div>
        </div>
        <!-- GRAFIK (di bawah Surat terbaru) -->
        <div class="charts-grid tunggal" data-dash>
            <div class="chart-card main-chart">
                <div class="chart-header">
                    <h3 id="chartJudul">Surat per bulan</h3>
                    <div class="seg" id="segGrafik" role="group" aria-label="Periode grafik">
                        <button type="button" data-m="hari">Hari</button><button type="button" data-m="bulan" class="on">Bulan</button><button type="button" data-m="tahun">Tahun</button>
                    </div>
                    <select id="grafikBulan" class="grafik-opsi" aria-label="Pilih bulan" hidden></select>
                    <select id="grafikTahun" class="grafik-opsi" aria-label="Rentang tahun" hidden><option value="5">5 tahun</option><option value="10" selected>10 tahun</option></select>
                    <label class="grafik-filter toolbar">Jenis: <select id="fGrafikJenis" aria-label="Saring grafik menurut jenis surat"><option value="">Semua jenis surat</option></select></label>
                </div>
                <p class="chart-sub" id="chartSub"></p>
                <div class="bars" id="bars" aria-label="Grafik jumlah surat per bulan"></div>
            </div>
        </div>
    </main>

    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Buka sidebar" aria-expanded="false" aria-controls="mainSidebar" title="Buka/tutup menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
    <div class="toast" id="toast" role="status"></div>

    <script>
        // Video hero: jalan otomatis (tanpa suara), berulang. Bila file tidak ada, tampil keterangan.
        (function () {
            const sec = document.getElementById('videoSec');
            const main = document.querySelector('main.main-content');
            const v = document.getElementById('heroVideo');
            v.muted = true; v.defaultMuted = true; v.setAttribute('muted', '');
            sec.querySelector('source').addEventListener('error', () => { sec.classList.add('gagal'); main.classList.remove('ada-video'); });
            const mulai = () => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
            mulai();
            v.addEventListener('canplay', mulai);
            // Bila browser menahan autoplay, mulai pada interaksi pertama (klik/sentuh/gulir/tombol)
            ['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(ev =>
                window.addEventListener(ev, () => { if (v.paused) mulai(); }, { once: true, passive: true, capture: true }));
            document.addEventListener('visibilitychange', () => { if (!document.hidden && v.paused) mulai(); });
        })();
    </script>
    <script src="app.js?v=13"></script>
    <script src="login-modal.js?v=3"></script>
    <script src="profil.js?v=2"></script>
    <script>
        // Statistik dashboard: dimuat ulang setiap rentang tanggal berubah (event "rentang" di bawah halaman).
        (function () {
            const { $, esc, tglIndo, api, toast } = App;
            const BLN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            const BLN_PENUH = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            let terakhir = '', rentangIni = null;

            // ---------- Grafik: kolom dibuat sekali, lalu tingginya dianimasikan naik/turun ----------
            function gambarGrafik(label, data, maks, aktif) {
                const bars = $('bars');
                bars.classList.toggle('padat', label.length > 12);
                if (bars.children.length !== label.length) {
                    bars.innerHTML = label.map((m) => '<div class="bar-col"><span class="v">0</span><div class="b" style="height:0"></div><span class="m">' + esc(m) + '</span></div>').join('');
                    void bars.offsetHeight;   // pastikan tinggi awal 0 tergambar dulu supaya batang "tumbuh" dari bawah
                }
                requestAnimationFrame(() => requestAnimationFrame(() => {
                    [...bars.children].forEach((kol, i) => {
                        kol.classList.toggle('on', aktif(i));
                        kol.querySelector('.v').textContent = data[i];
                        kol.querySelector('.b').style.height = Math.round((data[i] / maks) * 85) + '%';
                    });
                }));
            }
            let filterTerisi = false;
            function isiFilterJenis(daftar) {
                if (filterTerisi || !daftar.length) return;
                filterTerisi = true;
                const sel = $('fGrafikJenis');
                sel.insertAdjacentHTML('beforeend', daftar.slice().sort((x, y) => x.nama.localeCompare(y.nama)).map((j) => '<option value="' + esc(j.kode) + '">' + esc(j.nama) + ' (' + esc(j.kode) + ')</option>').join(''));
            }

            // ---------- Jenis surat: carousel otomatis + seret, atau kotak-kotak (Lihat semua) ----------
            const trek = $('jenisTrack'), grid = $('jenisGrid'), tombol = $('btnJenisSemua');
            let posisi = 0, semuaMode = false, ttd = '', geserAktif = true, tahan = false;
            const kartuJenis = (j) => '<a class="jenis-card" draggable="false" href="#tabelTerbaru" data-kode="' + esc(j.kode) + '">' +
                '<span class="jk">' + esc(j.kode) + '</span><span class="jn">' + esc(j.nama) + '</span><span class="jc"><b>' + j.n + '</b> surat</span></a>';
            function tampilJenis(daftar) {
                const tanda = JSON.stringify(daftar);
                if (tanda === ttd) return;
                ttd = tanda;
                grid.innerHTML = daftar.length ? daftar.map(kartuJenis).join('') : '<p class="galeri-kosong">Belum ada jenis surat.</p>';   // semua jenis, termasuk yang 0 surat
                const atas = daftar.slice(0, 8);   // jenis yang sudah dipakai di depan, sisanya mengisi sampai 8 kotak
                trek.innerHTML = atas.length ? '<div class="jenis-set">' + atas.map(kartuJenis).join('') + '</div>' : '<p class="galeri-kosong">Belum ada jenis surat.</p>';
                trek.scrollLeft = 0; posisi = 0;
                const set = trek.querySelector('.jenis-set');
                if (set) {
                    const asli = set.innerHTML;
                    for (let i = 0; i < 6 && set.scrollWidth <= trek.clientWidth + 16; i++) set.insertAdjacentHTML('beforeend', asli);   // pastikan lebih lebar dari layar
                    trek.appendChild(set.cloneNode(true));   // salinan agar putarannya mulus
                }
            }
            // geser otomatis (berhenti saat kursor di atasnya atau sedang diseret)
            function gerak() {
                const sets = trek.querySelectorAll('.jenis-set');
                if (geserAktif && !tahan && !semuaMode && sets.length === 2) {
                    posisi += 0.6;
                    const setengah = sets[1].offsetLeft - sets[0].offsetLeft;
                    if (posisi >= setengah) posisi -= setengah;
                    trek.scrollLeft = posisi;
                } else posisi = trek.scrollLeft;
                requestAnimationFrame(gerak);
            }
            requestAnimationFrame(gerak);
            trek.addEventListener('mouseenter', () => { tahan = true; });
            trek.addEventListener('mouseleave', () => { tahan = false; });
            trek.addEventListener('touchstart', () => { tahan = true; }, { passive: true });
            trek.addEventListener('touchend', () => { setTimeout(() => { tahan = false; }, 1500); });
            // seret dengan kursor
            let seret = null, bergerak = false;
            trek.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') return; seret = { x: e.clientX, kiri: trek.scrollLeft }; bergerak = false; trek.classList.add('menyeret'); });
            window.addEventListener('pointermove', (e) => {
                if (!seret) return;
                const dx = e.clientX - seret.x;
                if (Math.abs(dx) > 4) bergerak = true;
                let p = seret.kiri - dx;
                const sets = trek.querySelectorAll('.jenis-set');
                if (sets.length === 2) { const h = sets[1].offsetLeft - sets[0].offsetLeft; p = ((p % h) + h) % h; seret.kiri = p + dx; }
                trek.scrollLeft = p; posisi = p;
            });
            window.addEventListener('pointerup', () => { seret = null; trek.classList.remove('menyeret'); });
            trek.addEventListener('click', (e) => { if (bergerak) { e.preventDefault(); bergerak = false; } }, true);
            tombol.addEventListener('click', () => {
                semuaMode = !semuaMode;
                document.querySelectorAll('[data-dash]').forEach((el) => { el.hidden = semuaMode; });
                trek.hidden = semuaMode; grid.hidden = !semuaMode;
                tombol.textContent = semuaMode ? 'Kembali ke dashboard' : 'Lihat semua';
                $('jenisSec').classList.toggle('semua', semuaMode);
            });
            document.addEventListener('click', (e) => {
                const k = e.target.closest('.jenis-card[data-kode]');
                if (!k) return;
                e.preventDefault();
                if (semuaMode) tombol.click();
                jenisPilih = jenisPilih === k.dataset.kode ? '' : k.dataset.kode;   // klik lagi = batal
                document.querySelectorAll('.jenis-card[data-kode]').forEach((c) => c.classList.toggle('dipilih', !!jenisPilih && c.dataset.kode === jenisPilih));
                muatTerbaru();
                $('tabelTerbaru').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            const pct = (n, t) => (t ? Math.round((n / t) * 100) : 0) + '%';

            // ---------- Surat terbaru (mengikuti kalender; tanpa filter — hanya bisa disaring dengan klik kotak jenis) ----------
            let tungguTerbaru = 0, baris = [], jenisPilih = '';
            async function muatTerbaru() {
                if (!rentangIni) return;
                const my = ++tungguTerbaru;
                const p = new URLSearchParams({ aksi: 'terbaru', dari: rentangIni.dari, sampai: rentangIni.sampai, limit: 12 });
                if (jenisPilih) p.set('jenis', jenisPilih);
                try {
                    const d = await api('api/surat.php?' + p);
                    if (my !== tungguTerbaru) return;
                    $('terbaruInfo').textContent = rentangIni.label + ' · ' + d.surat.length + (d.total > d.surat.length ? ' dari ' + d.total : '') + ' surat' + (jenisPilih ? ' · jenis ' + jenisPilih : '');
                    baris = d.surat;
                    $('galeri').innerHTML = d.surat.length ? d.surat.map(App.kartuSurat).join('') : '<p class="galeri-kosong">Tidak ada surat pada rentang tanggal ini.</p>';
                } catch (e) { toast(e.message, true); $('galeri').innerHTML = '<p class="galeri-kosong">' + esc(e.message) + '</p>'; }
            }
            const segarkan = () => { terakhir = ''; if (rentangIni) document.dispatchEvent(new CustomEvent('rentang', { detail: rentangIni })); muatGrafik(true); if (mencari) cari(true); };
            // Dashboard hanya untuk melihat: klik kartu -> surat dibuka
            App.pasangKartuSurat($('galeri'), { hanyaBuka: true, cari: (id) => baris.find((x) => String(x.id) === id), selesai: segarkan });

            // ---------- Pencarian di atas video: saat diketik, dashboard berubah menjadi daftar surat yang cocok ----------
            const utama = $('halUtama'), inp = $('cariUtama'), hapusX = $('cariHapus');
            let mencari = false, hasil = [], hasilTotal = 0, tungguCari = 0, tmCari;
            const videoOk = () => !$('videoSec').classList.contains('gagal');
            async function cari(ulang) {
                const q = inp.value.trim();
                if (!q) { berhenti(); return; }
                const my = ++tungguCari;
                const off = ulang ? 0 : hasil.length;
                try {
                    const d = await api('api/surat.php?' + new URLSearchParams({ aksi: 'daftar', q, limit: 12, offset: off }));
                    if (my !== tungguCari) return;
                    hasil = off ? hasil.concat(d.surat) : d.surat; hasilTotal = d.total;
                    $('hasilInfo').textContent = '“' + q + '” · ' + d.total + ' surat ditemukan';
                    $('hasilList').innerHTML = hasil.length ? hasil.map(App.kartuSurat).join('') : '<p class="galeri-kosong">Tidak ada surat yang cocok dengan “' + esc(q) + '”.</p>';
                    $('hasilLagi').hidden = hasil.length >= hasilTotal;
                } catch (e) { toast(e.message, true); }
            }
            function mulaiCari() {
                if (!mencari) { mencari = true; utama.classList.add('mencari'); utama.classList.remove('ada-video'); $('hasilCari').hidden = false; }
                hapusX.hidden = false;
            }
            function berhenti() {
                tungguCari++; mencari = false; hasil = [];
                utama.classList.remove('mencari'); if (videoOk()) utama.classList.add('ada-video');
                $('hasilCari').hidden = true; hapusX.hidden = true; $('hasilList').innerHTML = '';
            }
            inp.addEventListener('input', () => {
                clearTimeout(tmCari);
                if (!inp.value.trim()) { berhenti(); return; }
                mulaiCari(); tmCari = setTimeout(() => cari(true), 300);
            });
            $('cariAtas').addEventListener('submit', (ev) => { ev.preventDefault(); if (inp.value.trim()) { mulaiCari(); cari(true); } });
            hapusX.addEventListener('click', () => { inp.value = ''; berhenti(); inp.focus(); });
            inp.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { inp.value = ''; berhenti(); } });
            $('hasilLagi').addEventListener('click', () => cari(false));
            App.pasangKartuSurat($('hasilList'), { hanyaBuka: true, cari: (id) => hasil.find((x) => String(x.id) === id), selesai: segarkan });

            // ---------- Grafik: Hari (tanggal 1..akhir bulan), Bulan (Jan–Des tahun ini), Tahun (5–10 tahun sampai sekarang) ----------
            const sekarang = new Date(), thIni = sekarang.getFullYear();
            let modeGrafik = 'bulan', bulanGrafik = sekarang.getMonth(), tungguGrafik = 0;
            $('grafikBulan').innerHTML = BLN_PENUH.map((n, i) => '<option value="' + i + '"' + (i === bulanGrafik ? ' selected' : '') + '>' + n + ' ' + thIni + '</option>').join('');
            const two = (n) => String(n).padStart(2, '0');
            async function muatGrafik() {
                const my = ++tungguGrafik, jenis = $('fGrafikJenis').value;
                const dari = modeGrafik === 'hari' ? thIni + '-' + two(bulanGrafik + 1) + '-01' : thIni + '-01-01';
                const sampai = modeGrafik === 'hari' ? thIni + '-' + two(bulanGrafik + 1) + '-' + two(new Date(thIni, bulanGrafik + 1, 0).getDate()) : thIni + '-12-31';
                try {
                    const d = await api('api/surat.php?' + new URLSearchParams({ aksi: 'statistik', dari, sampai, jenis, jumlah_tahun: $('grafikTahun').value }));
                    if (my !== tungguGrafik) return;
                    const maks = (a) => Math.max(1, ...a);
                    if (modeGrafik === 'hari') {
                        $('chartJudul').textContent = 'Surat per hari — ' + BLN_PENUH[bulanGrafik] + ' ' + thIni;
                        $('chartSub').textContent = 'Jumlah surat setiap tanggal pada ' + BLN_PENUH[bulanGrafik] + ' ' + thIni;
                        const hariIni = (bulanGrafik === sekarang.getMonth()) ? sekarang.getDate() : -1;
                        gambarGrafik(d.per_hari.map((_, i) => String(i + 1)), d.per_hari, maks(d.per_hari), (i) => i + 1 === hariIni);
                    } else if (modeGrafik === 'bulan') {
                        $('chartJudul').textContent = 'Surat per bulan — ' + thIni;
                        $('chartSub').textContent = 'Jumlah surat setiap bulan, Januari sampai Desember ' + thIni;
                        gambarGrafik(BLN, d.per_bulan, maks(d.per_bulan), (i) => i === sekarang.getMonth());
                    } else {
                        const n = d.per_tahun.length;
                        $('chartJudul').textContent = 'Surat per tahun — ' + d.label_tahun[0] + '–' + thIni;
                        $('chartSub').textContent = 'Jumlah surat setiap tahun, ' + n + ' tahun terakhir sampai ' + thIni;
                        gambarGrafik(d.label_tahun, d.per_tahun, maks(d.per_tahun), (i) => i === n - 1);
                    }
                    $('bars').setAttribute('aria-label', $('chartJudul').textContent);
                    isiFilterJenis(d.per_jenis || []);
                } catch (e) { toast(e.message, true); }
            }
            $('segGrafik').addEventListener('click', (e) => {
                const b = e.target.closest('button[data-m]'); if (!b) return;
                modeGrafik = b.dataset.m;
                $('segGrafik').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
                $('grafikBulan').hidden = modeGrafik !== 'hari'; $('grafikTahun').hidden = modeGrafik !== 'tahun';
                $('bars').innerHTML = '';   // jumlah kolom berbeda: bangun ulang
                muatGrafik();
            });
            $('grafikBulan').addEventListener('change', () => { bulanGrafik = +$('grafikBulan').value; muatGrafik(); });
            $('grafikTahun').addEventListener('change', () => { $('bars').innerHTML = ''; muatGrafik(); });
            $('fGrafikJenis').addEventListener('change', muatGrafik);
            muatGrafik();

            document.addEventListener('rentang', async (ev) => {
                const { dari, sampai, mode } = ev.detail;
                rentangIni = ev.detail;
                const kunci = dari + sampai + mode;
                if (kunci === terakhir) return;
                terakhir = kunci;
                try {
                    const d = await api('api/surat.php?aksi=statistik&dari=' + dari + '&sampai=' + sampai);
                    if (kunci !== terakhir) return;
                    $('jenisRentang').textContent = '· ' + ev.detail.label;
                    tampilJenis(d.per_jenis || []);
                    muatTerbaru();
                } catch (e) {
                    terakhir = '';
                    toast(e.message, true);
                    $('galeri').innerHTML = '<p class="galeri-kosong">' + esc(e.message) + '</p>';
                }
            });
        })();
    </script>
    <script>
        // Kalender dihapus: dashboard menampilkan tahun berjalan.
        (function () {
            const y = new Date().getFullYear();
            document.dispatchEvent(new CustomEvent('rentang', { detail: { dari: y + '-01-01', sampai: y + '-12-31', mode: 'year', label: 'Tahun ' + y } }));
        })();
    </script>
    <script src="mobile.js?v=1"></script>
</body>
</html>
